[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentinelcap"
version = "1.0.0"
description = "Manual VMware collection and labeling of LogSentinel normalized Sysmon telemetry"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nam" }]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.6",
    "confluent-kafka>=2.5",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "mypy>=1.9", "types-PyYAML", "ruff>=0.4"]

[project.scripts]
sentinelcap = "sentinelcap.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinelcap"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["E501"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
packages = ["sentinelcap"]
check_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff.lint.per-file-ignores]
# typer.Option/typer.Argument as parameter defaults is Typer's documented API.
"src/sentinelcap/cli.py" = ["B008"]
