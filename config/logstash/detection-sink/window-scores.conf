# window-scores pipeline of logstash-detection-sink
# Role: persist one document per window that inference scored (event.kind "metric",
# with the features the model saw) to Elasticsearch, so that every window can be filtered by
# logsentinel.verdict.reported / gated / suspicious without losing the activity detail.
# No transformation: the service already emits the document in its final shape.
#
# logsentinel.window.id (the _id) is the one of the detection of the same window, if any.
# A window that is flushed early is sent again with the same id when it closes; the later
# document overwrites the earlier snapshot (windowing.py).
#
# One index per month (about one document per host every 10 s while it is active).

input {
  kafka {
    bootstrap_servers => "kafka:29092"
    # docker-compose.yml passes LOGSENTINEL_TOPIC_WINDOW_SCORES (the topic the service writes to).
    topics => ["${LOGSENTINEL_TOPIC_WINDOW_SCORES:security.ransomware.window-scores}"]
    group_id => "logstash-detection-sink-window-scores"
    # Used only while the group has no committed offset: never skip what was produced earlier.
    auto_offset_reset => "earliest"
    codec => "json"
  }
}

filter {
  # Logstash adds @version and (ECS compatibility) event.original; neither is part of the document.
  mutate { remove_field => ["@version", "[event][original]"] }
  if [logsentinel][window][id] {
    mutate { copy => { "[logsentinel][window][id]" => "[@metadata][document_id]" } }
  }
}

output {
  if [@metadata][document_id] {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      # The index templates and pipelines come from scripts/init-elasticsearch.sh.
      manage_template => false
      index => "ransomware-window-scores-%{+YYYY.MM}"
      document_id => "%{[@metadata][document_id]}"
    }
  } else {
    # A document without a window id is never indexed under a made-up _id. It stays
    # visible in the container log, which Docker rotates.
    stdout { codec => json_lines }
  }
}
