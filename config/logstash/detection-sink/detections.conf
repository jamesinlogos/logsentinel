# detections pipeline of logstash-detection-sink
# Role: persist the detections of inference (windows that passed the Phase 2 gate
# and were reported, event.kind "alert") to Elasticsearch. No transformation: the service
# already emits the document in its final shape (inference/README.md section 7).
#
# logsentinel.window.id is derived from the host and the end of the window, so a detection the
# service sends again (at-least-once) overwrites its document instead of duplicating it. The
# same id names the window score of that window in ransomware-window-scores-*.
#
# One index per month (volume: a few hundred documents a day), see AGENTS.md section 11.8.

input {
  kafka {
    bootstrap_servers => "kafka:29092"
    # docker-compose.yml passes LOGSENTINEL_TOPIC_DETECTIONS (the topic the service writes to).
    topics => ["${LOGSENTINEL_TOPIC_DETECTIONS:security.ransomware.detections}"]
    group_id => "logstash-detection-sink"
    # Used only while the group has no committed offset: never skip what was produced earlier.
    auto_offset_reset => "earliest"
    codec => "json"
  }
}

filter {
  # Logstash adds @version and (ECS compatibility) event.original; neither is part of the document.
  mutate { remove_field => ["@version", "[event][original]"] }
  if [logsentinel][window][id] {
    mutate { copy => { "[logsentinel][window][id]" => "[@metadata][document_id]" } }
  }
}

output {
  if [@metadata][document_id] {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      # The index templates and pipelines come from scripts/init-elasticsearch.sh.
      manage_template => false
      index => "ransomware-detections-%{+YYYY.MM}"
      document_id => "%{[@metadata][document_id]}"
    }
  } else {
    # A document without a window id is never indexed under a made-up _id. It stays
    # visible in the container log, which Docker rotates.
    stdout { codec => json_lines }
  }
}
