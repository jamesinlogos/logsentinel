# sink-es pipeline: audit / threat-hunting index.
# Receives the fully normalized event from `ingest` unchanged (keeps the
# human-readable `message`). Runs with a persisted queue (pipelines.yml) so an
# Elasticsearch outage buffers here instead of stalling the feed to the inference service.

input {
  pipeline { address => "sink-es" }
}

filter {
  # The pipeline input creates a new Logstash event and adds @version again.
  mutate { remove_field => ["@version"] }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "windows-telemetry-%{+YYYY.MM.dd}"
    # Ties _id to the source Kafka message (see "Idempotency / ordering" in
    # ingest.conf) so re-delivery overwrites instead of duplicating.
    document_id => "%{[@metadata][kafka][topic]}-%{[@metadata][kafka][partition]}-%{[@metadata][kafka][offset]}"
  }
}
