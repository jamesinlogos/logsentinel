# sink-inference pipeline: normalized feed for inference (ECS threat.*, no @version).
# `message` only repeats winlog.event_data, so it is not carried on the topic.

input {
  pipeline { address => "sink-inference" }
}

filter {
  # The pipeline input creates a new Logstash event and adds @version again.
  mutate { remove_field => ["message", "@version"] }
}

output {
  kafka {
    bootstrap_servers => "kafka:29092"
    topic_id => "${LOGSENTINEL_TOPIC_NORMALIZED_TELEMETRY:telemetry.windows.normalized}"
    codec => "json"
    # Per-host partition affinity for the inference service's per-host sliding
    # window (see "Idempotency / ordering" in ingest.conf). host.name is set
    # by Winlogbeat/libbeat on every event. An event without it would get the
    # literal text %{[host][name]} as its key (measured on Logstash 9.5.3), so
    # all such events would share one partition.
    message_key => "%{[host][name]}"
  }
}
