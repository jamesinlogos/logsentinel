# LogSentinel — backend infrastructure stack
# See README.md for the full architecture description. Names follow AGENTS.md section 11:
# services are the component slugs, containers are logsentinel-<service>, the volumes are
# <service>-data and the one network is "backend" (Compose prefixes all of them with the
# project name below, e.g. logsentinel_backend).
#
# `docker compose up -d` leaves a stack that is ready to use: the one-shot services kafka-init,
# elasticsearch-init and kibana-init create the topics, install the Elasticsearch configuration and
# install the Kibana alerting rule with its notification action, and everything that writes or reads
# them starts only after they have succeeded. The defaults after `:-` below are
# the versions of .env, so a missing .env cannot downgrade the images (a test keeps them equal).
name: logsentinel

# Docker keeps the stdout/stderr of every container in a JSON file that grows
# without limit unless it is capped: 3 files of 10 MB per container.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Images used by a service and by its init service.
x-kafka-image: &kafka-image apache/kafka:${LOGSENTINEL_KAFKA_IMAGE_TAG:-4.3.1}
x-elasticsearch-image: &elasticsearch-image docker.elastic.co/elasticsearch/elasticsearch:${LOGSENTINEL_ELASTIC_STACK_VERSION:-9.5.3}

# Logstash answers on its monitoring API (port 9600 inside the container) and reports green or
# yellow; red means a pipeline failed. Starting takes a minute or two, hence start_period.
x-logstash-healthcheck: &logstash-healthcheck
  test: ["CMD-SHELL", "curl -sf http://localhost:9600/ | grep -Eq '\"status\":\"(green|yellow)\"' || exit 1"]
  interval: 30s
  timeout: 10s
  retries: 5
  start_period: 120s

services:

  # ---------------------------------------------------------------------
  # Message broker (KRaft mode — no ZooKeeper, deprecated since Kafka 3.5
  # and removed entirely in Kafka 4.0).
  # ---------------------------------------------------------------------
  kafka:
    image: *kafka-image
    container_name: logsentinel-kafka
    restart: unless-stopped
    logging: *default-logging
    # Kafka, Elasticsearch and Logstash write out their state on SIGTERM; Docker's default of 10 s
    # may cut that short and leave an unclean shutdown to recover from.
    stop_grace_period: 30s
    ports:
      - "${LOGSENTINEL_KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: ${LOGSENTINEL_KAFKA_NODE_ID:-1}
      KAFKA_PROCESS_ROLES: broker,controller
      # Two client listeners:
      #   INTERNAL (kafka:29092)       -> containers on the backend network
      #   EXTERNAL (<host-ip>:9092)    -> Winlogbeat on the Windows server
      # Kafka tells every client to reconnect to the ADVERTISED address, so the
      # external one must be an IP/hostname the Windows machine can reach.
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://${LOGSENTINEL_KAFKA_ADVERTISED_HOST:-192.168.110.1}:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      # Store topics in the kafka-data volume. Without it the image writes to
      # /tmp inside the container and every topic is lost when the container
      # is re-created.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks: [backend]

  # ---------------------------------------------------------------------
  # Storage & search backend
  # ---------------------------------------------------------------------
  elasticsearch:
    image: *elasticsearch-image
    container_name: logsentinel-elasticsearch
    restart: unless-stopped
    logging: *default-logging
    stop_grace_period: 30s
    environment:
      - discovery.type=single-node
      # Security disabled for lab simplicity — re-enable (TLS + auth) before
      # any production-like deployment. See README.md section 12.
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=${LOGSENTINEL_ES_JAVA_OPTS:--Xms1g -Xmx1g}"
    ports:
      # Loopback only: the victim VM reaches the host and must not see this unauthenticated API.
      - "127.0.0.1:${LOGSENTINEL_ES_PORT:-9200}:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks: [backend]

  # ---------------------------------------------------------------------
  # One-shot initialisation. Each runs a script of scripts/ (which can also be run by hand), is
  # idempotent, exits, and is not restarted. Services that need what it creates wait for it with
  # `condition: service_completed_successfully`; if it fails, they do not start.
  # ---------------------------------------------------------------------
  # Kafka topics: telemetry.windows.normalized must exist before sentinelcap subscribes (otherwise
  # UNKNOWN_TOPIC_OR_PART), and the partition count of the topics is fixed here instead of by chance.
  kafka-init:
    image: *kafka-image
    container_name: logsentinel-kafka-init
    restart: "no"
    logging: *default-logging
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["bash", "/scripts/create-topics.sh"]
    volumes:
      - ./scripts:/scripts:ro
    environment:
      # Empty: the script runs kafka-topics.sh directly instead of through `docker exec`.
      - LOGSENTINEL_KAFKA_EXEC=
      - LOGSENTINEL_KAFKA_BOOTSTRAP=kafka:29092
      - LOGSENTINEL_TOPIC_RAW_TELEMETRY=${LOGSENTINEL_TOPIC_RAW_TELEMETRY:-telemetry.windows.sysmon.raw}
      - LOGSENTINEL_TOPIC_NORMALIZED_TELEMETRY=${LOGSENTINEL_TOPIC_NORMALIZED_TELEMETRY:-telemetry.windows.normalized}
      - LOGSENTINEL_TOPIC_DETECTIONS=${LOGSENTINEL_TOPIC_DETECTIONS:-security.ransomware.detections}
      - LOGSENTINEL_TOPIC_WINDOW_SCORES=${LOGSENTINEL_TOPIC_WINDOW_SCORES:-security.ransomware.window-scores}
    networks: [backend]

  # Elasticsearch configuration of config/elasticsearch/: ingest pipeline, retention (ILM) policies,
  # component and index templates. It must exist before the first document is written, or the index
  # is created with dynamic mapping (wrong field types, no retention, no event.ingested).
  elasticsearch-init:
    image: *elasticsearch-image
    container_name: logsentinel-elasticsearch-init
    restart: "no"
    logging: *default-logging
    depends_on:
      elasticsearch:
        condition: service_healthy
    entrypoint: ["bash", "/scripts/init-elasticsearch.sh"]
    volumes:
      - ./scripts:/scripts:ro
      - ./config/elasticsearch:/config/elasticsearch:ro
    environment:
      - LOGSENTINEL_ES_HOST=http://elasticsearch:9200
    networks: [backend]

  # ---------------------------------------------------------------------
  # Visualization layer
  # ---------------------------------------------------------------------
  kibana:
    image: docker.elastic.co/kibana/kibana:${LOGSENTINEL_ELASTIC_STACK_VERSION:-9.5.3}
    container_name: logsentinel-kibana
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      # Kibana alerting (README.md section 9.2) refuses to run without a permanent key. `:?` stops
      # `docker compose` when .env lacks it; the key must stay the same across redeploys.
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=${LOGSENTINEL_KIBANA_ENCRYPTION_KEY:?set LOGSENTINEL_KIBANA_ENCRYPTION_KEY in .env}
    ports:
      # Loopback only (see elasticsearch).
      - "127.0.0.1:${LOGSENTINEL_KIBANA_PORT:-5601}:5601"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5601/api/status | grep -q '\"level\":\"available\"' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks: [backend]

  # Kibana alerting of README.md section 9.2: the rule `ransomware-detections`, then the notification
  # connector and the one action that queues notices for the `notifications` worker. It runs
  # scripts/init-kibana.sh (alerting_setup.py and notification_setup.py with --apply) in a plain
  # Python image: both scripts use only the standard library. They create only what is absent and
  # refuse to change anything that exists and differs, so a restart of the stack is a no-op. They
  # read ../config next to the scripts (/config) and write their reports and the backup of the
  # public Kibana state to ../archives (/archives, ./archives on the host).
  kibana-init:
    image: python:3.14-slim
    container_name: logsentinel-kibana-init
    restart: "no"
    logging: *default-logging
    depends_on:
      elasticsearch:
        condition: service_healthy
      elasticsearch-init:
        condition: service_completed_successfully
      kibana:
        condition: service_healthy
    entrypoint: ["bash", "/scripts/init-kibana.sh"]
    volumes:
      - ./scripts:/scripts:ro
      - ./config:/config:ro
      - ./archives:/archives
    environment:
      - LOGSENTINEL_ES_HOST=http://elasticsearch:9200
      - LOGSENTINEL_KIBANA_HOST=http://kibana:5601
    networks: [backend]

  # ---------------------------------------------------------------------
  # Ingest pipeline: parses raw Sysmon telemetry, normalizes to ECS,
  # writes to Elasticsearch and republishes to Kafka for inference.
  # ---------------------------------------------------------------------
  logstash-ingest:
    image: docker.elastic.co/logstash/logstash:${LOGSENTINEL_ELASTIC_STACK_VERSION:-9.5.3}
    container_name: logsentinel-logstash-ingest
    restart: unless-stopped
    logging: *default-logging
    stop_grace_period: 30s
    healthcheck: *logstash-healthcheck
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      elasticsearch-init:
        condition: service_completed_successfully
    volumes:
      - ./config/logstash/ingest/pipelines.yml:/usr/share/logstash/config/pipelines.yml:ro
      - ./config/logstash/ingest/ingest.conf:/usr/share/logstash/pipeline/ingest.conf:ro
      - ./config/logstash/ingest/sink-es.conf:/usr/share/logstash/pipeline/sink-es.conf:ro
      - ./config/logstash/ingest/sink-inference.conf:/usr/share/logstash/pipeline/sink-inference.conf:ro
      # Persisted queue of the sink-es pipeline must survive container re-creation.
      - logstash-ingest-data:/usr/share/logstash/data
    environment:
      - LOGSENTINEL_TOPIC_RAW_TELEMETRY=${LOGSENTINEL_TOPIC_RAW_TELEMETRY:-telemetry.windows.sysmon.raw}
      - LOGSENTINEL_TOPIC_NORMALIZED_TELEMETRY=${LOGSENTINEL_TOPIC_NORMALIZED_TELEMETRY:-telemetry.windows.normalized}
    networks: [backend]

  # ---------------------------------------------------------------------
  # Detection sink: consumes what inference produces and writes
  # it to Elasticsearch, one pipeline per topic (detections, window-scores).
  # No transformation logic — the service already emits data in its final
  # shape (inference/README.md section 7).
  # ---------------------------------------------------------------------
  logstash-detection-sink:
    image: docker.elastic.co/logstash/logstash:${LOGSENTINEL_ELASTIC_STACK_VERSION:-9.5.3}
    container_name: logsentinel-logstash-detection-sink
    restart: unless-stopped
    logging: *default-logging
    stop_grace_period: 30s
    healthcheck: *logstash-healthcheck
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      elasticsearch-init:
        condition: service_completed_successfully
    volumes:
      - ./config/logstash/detection-sink/pipelines.yml:/usr/share/logstash/config/pipelines.yml:ro
      - ./config/logstash/detection-sink/detections.conf:/usr/share/logstash/pipeline/detections.conf:ro
      - ./config/logstash/detection-sink/window-scores.conf:/usr/share/logstash/pipeline/window-scores.conf:ro
    environment:
      - LOGSENTINEL_TOPIC_DETECTIONS=${LOGSENTINEL_TOPIC_DETECTIONS:-security.ransomware.detections}
      - LOGSENTINEL_TOPIC_WINDOW_SCORES=${LOGSENTINEL_TOPIC_WINDOW_SCORES:-security.ransomware.window-scores}
    networks: [backend]

  # ---------------------------------------------------------------------
  # Inference service: consumes normalized telemetry, emits a window score
  # per scored window and a detection for the reported ones
  # (inference/README.md). The trained model comes from
  # `make model` in inference/ and is mounted read-only; without a complete
  # model and a threshold that fit config.yaml the service exits with code 2
  # (a restarting container) instead of detecting with something else.
  # ---------------------------------------------------------------------
  inference:
    build: ./inference
    container_name: logsentinel-inference
    restart: unless-stopped
    logging: *default-logging
    # SIGTERM: the service emits its pending windows and flushes within
    # kafka.shutdown_timeout_sec (15 s) after an in-flight produce of at most
    # kafka.produce_timeout_sec (10 s); Docker's default of 10 s would kill it mid-flush.
    stop_grace_period: 30s
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    volumes:
      - ./inference/artifacts:/app/artifacts:ro
    environment:
      # INFERENCE__<SECTION>__<KEY> overrides config.yaml (inference/README.md).
      - INFERENCE__KAFKA__BOOTSTRAP_SERVERS=kafka:29092
      - INFERENCE__KAFKA__INPUT_TOPIC=${LOGSENTINEL_TOPIC_NORMALIZED_TELEMETRY:-telemetry.windows.normalized}
      - INFERENCE__KAFKA__DETECTIONS_TOPIC=${LOGSENTINEL_TOPIC_DETECTIONS:-security.ransomware.detections}
      - INFERENCE__KAFKA__WINDOW_SCORES_TOPIC=${LOGSENTINEL_TOPIC_WINDOW_SCORES:-security.ransomware.window-scores}
      # One ECS JSON record per line on stdout (inference/README.md section 9.4).
      - INFERENCE__LOG__FORMAT=json
      - INFERENCE__LOG__LEVEL=${LOGSENTINEL_LOG_LEVEL:-INFO}
    networks: [backend]

  # ---------------------------------------------------------------------
  # Notification worker: sends the envelopes that the Kibana rule action writes to
  # ransomware-notifications-* to Telegram and Gmail and stores one receipt per channel
  # in ransomware-notification-deliveries-* (notifications/README.md). Without complete
  # credentials in .env it exits with code 2 (a restarting container).
  # ---------------------------------------------------------------------
  notifications:
    build: ./notifications
    container_name: logsentinel-notifications
    restart: unless-stopped
    logging: *default-logging
    stop_grace_period: 30s
    depends_on:
      elasticsearch:
        condition: service_healthy
      elasticsearch-init:
        condition: service_completed_successfully
      # Without its rule and action there is nothing to send; if kibana-init fails, `up -d` says so.
      kibana-init:
        condition: service_completed_successfully
    environment:
      - LOGSENTINEL_ES_HOST=http://elasticsearch:9200
      - LOGSENTINEL_TELEGRAM_BOT_TOKEN=${LOGSENTINEL_TELEGRAM_BOT_TOKEN}
      - LOGSENTINEL_TELEGRAM_CHAT_ID=${LOGSENTINEL_TELEGRAM_CHAT_ID}
      - LOGSENTINEL_GMAIL_SENDER=${LOGSENTINEL_GMAIL_SENDER}
      - LOGSENTINEL_GMAIL_APP_PASSWORD=${LOGSENTINEL_GMAIL_APP_PASSWORD}
      - LOGSENTINEL_EMAIL_RECIPIENTS=${LOGSENTINEL_EMAIL_RECIPIENTS}
      - LOGSENTINEL_NOTIFICATIONS_POLL_SEC=${LOGSENTINEL_NOTIFICATIONS_POLL_SEC:-30}
      - LOGSENTINEL_NOTIFICATIONS_TIMEOUT_SEC=${LOGSENTINEL_NOTIFICATIONS_TIMEOUT_SEC:-15}
    healthcheck:
      test: ["CMD", "python", "-m", "notifications", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks: [backend]

networks:
  backend:
    driver: bridge

volumes:
  kafka-data:
  elasticsearch-data:
  logstash-ingest-data:
